<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>FTN Cloud · RouterB</title><style>body{margin:0;background:#07111f;color:#d9f7ff;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:700}.muted{color:#86a4b3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:24px}.card{background:#0c1b2b;border:1px solid #18384a;border-radius:14px;padding:18px}.ok{color:#62e6a8}.badge{display:inline-block;border:1px solid #26556a;border-radius:999px;padding:4px 9px;font-size:12px}.toolbar{margin-top:28px}.btn{background:#102b3d;color:#d9f7ff;border:1px solid #28627a;border-radius:9px;padding:10px 14px;cursor:pointer}</style></head><body><main><div class="top"><div><div class="brand">⚡ FTN Cloud · RouterB</div><div class="muted">Multi-protocol node control plane</div></div><span class="badge ok">● API Online</span></div><div id="node" class="muted" style="margin-top:18px">Loading node…</div><div id="grid" class="grid"></div><div class="toolbar"><button class="btn" onclick="load()">Refresh</button></div></main><script>async function load(){let n=await fetch('/api/v1/node').then(r=>r.json());document.querySelector('#node').textContent='Node: '+n.name+' · '+(n.domain||'local');let p=await fetch('/api/v1/protocols').then(r=>r.json());document.querySelector('#grid').innerHTML=p.map(x=>`<div class="card"><b>${x.name}</b><p class="muted">${x.type}</p><span class="badge ok">${x.status}</span></div>`).join('')}load()</script></body></html>
